# Hermès Agent — déploiement VPS netcup (minimal, au repos)
# Géré via Claude Code. Périmètre initial : aucun bot, aucun port exposé, aucun cron.
#   Build            : docker compose build
#   Run (daemon idle): docker compose up -d
#   CLI interactif   : docker exec -it hermes-agent hermes chat
#   One-shot         : docker exec hermes-agent hermes -z "..."
services:
  hermes:
    build: .
    image: hermes-agent:local
    container_name: hermes-agent
    restart: unless-stopped
    env_file: [.env]
    environment:
      - TZ=Europe/Paris
    volumes:
      - /opt/hermes-data:/opt/data   # données persistantes : token OAuth, sessions, config, logs
    # PAS de `ports:` — rien d'exposé (le firewall bloque de toute façon tout sauf SSH).
    # `gateway run` = daemon au repos : sans tokens de bots il ne fait que tenir le
    # scheduler (0 job). Permet `docker exec ... hermes chat`.
    ports:
      - "100.80.171.85:9119:9119"   # dashboard, IP Tailscale uniquement (invisible du public)
    command: ["gateway", "run"]
